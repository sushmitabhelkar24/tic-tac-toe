<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body{
            background-color: cadetblue;
            margin: 0;
            padding: 0;
        }
        p{
            margin-top: 10px;
            font-size: 100px;
            color:white;
        }
        .board{
            width:fit-content;
            display: block;
            margin: 20px auto;
            border: 10px solid rgb(40, 64, 77);
        }
        .row{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: aquamarine;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 0 8px 0 white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box:hover{
            transition: 0.5s;
            border-radius: 10px;
            box-shadow: 0 0 12px 0 white;
            background-color: rgb(89, 242, 191);
        }
        .Player{
            display: block;
            text-align: center;
            font-size: larger;
        }
        .btn{
            display:block;
            text-align: center;
            padding: 5px 20px;
            background-color:aquamarine ;
            font-size: 20px;
            height: 60px;
            width: 100px;
            border-radius: 50%;
            border:5px solid rgb(15, 84, 61);
        }
        .btn:hover{
          box-shadow: 0 0 50px 0 white;
          cursor: pointer;
        }
        .head{
          display: flex;
          justify-content: space-around;
          align-items: center;
        }
        .img{
          height: 80px;
          padding-top: 2px;
          padding-right: 5px;
        }
       
    </style>
</head>
<body>
   <div>
    
  <div class="head">
    <p style="margin-left: 5px;"><img src="right-arrow.png" class="img"/>Tic - Tac -Toe</p>
   <button class="btn" onclick="loadGame()">Reset</button>
  </div>
      
  
    <div>
      <div><span class="Player" >Current Player : <span id="wrongright">X</span></span> </div>
    <div class="board">
        <div class="row">
            <div class="box" onclick="selectBox(0)">1</div>
            <div class="box" onclick="selectBox(1)">2</div>
            <div class="box" onclick="selectBox(2)">3</div> 
         </div>
         <div class="row">
            <div class="box" onclick="selectBox(3)">4</div>
            <div class="box" onclick="selectBox(4)">5</div>
            <div class="box" onclick="selectBox(5)">6</div> 
         </div>
         <div class="row">
            <div class="box" onclick="selectBox(6)">7</div>
            <div class="box" onclick="selectBox(7)">8</div>
            <div class="box" onclick="selectBox(8)">9</div> 
         </div>
    </div>
   
 </div>
<script>
 const board=[-1,-1,-1,-1,-1,-1,-1,-1,-1];
 let currentPlayer = 'X'
 function boardPlay(){
    const allBoxes = document.querySelectorAll('.box');
   
    allBoxes.forEach((boxContent,i)=>{
        if(board[i]=== 'X'){
            boxContent.innerHTML = '<img src="cancel.png" height="90px"/>';
        }else if(board[i] === '✓'){
            boxContent.innerHTML = '<img src="tick.png" height="90px"/>';
        }else{
            boxContent.innerHTML = '';
        }
    })
}
boardPlay();

function selectBox(boxNum){

    if(board[boxNum] !== -1){
        alert("Invaild move click elsewhere")
        return;
    }

    board[boxNum] = currentPlayer
    boardPlay();

  if (!checkCurrentWinner()) {
  let isDraw = true;
  for (let i = 0; i < board.length; i++) {
    if (board[i] === -1) {
      isDraw = false;
      break;
    }
  }

  if (isDraw) {
    alert("It's a draw!");
    
  }
}

    if(currentPlayer === 'X'){
        currentPlayer = '✓'
    }else{
        currentPlayer = 'X'
    }

    const getCurrentPlay = document.getElementById("wrongright");
    getCurrentPlay.innerText = currentPlayer;

    checkCurrentWinner();
}

function loadGame(){
    board.fill(-1);
    boardPlay();

    currentPlayer = 'X';
    const getCurrentPlay = document.getElementById("wrongright");
    getCurrentPlay.innerText = currentPlayer;
}
function playerWinRule(places,player){
    const a = places[0];
    const b = places[1];
    const c = places[2];

    if(board[a] == player && board[b]== player && board[c] == player){
        return true
    }else{
        return false;
    }
}
function checkCurrentWinner(){

  if(playerWinRule([0,1,2],'X')){
    alert("X wins");
  }else if(playerWinRule([3,4,5],'X')){
    alert("X wins");
  }else if(playerWinRule([6,7,8],'X')){
    alert("X wins");
  }else if(playerWinRule([0,3,6],'X')){
    alert("X wins");
  }else if(playerWinRule([1,4,7],'X')){
    alert("X wins");
  }else if(playerWinRule([2,5,8],'X')){
    alert("X wins");
  }else if(playerWinRule([0,4,8],'X')){
    alert("X wins");
  }else if(playerWinRule([2,4,6],'X')){
    alert("X wins");
  }

  if(playerWinRule([0,1,2],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([3,4,5],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([6,7,8],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([0,3,6],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([1,4,7],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([2,5,8],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([0,4,8],'✓')){
    alert("✓ wins");
  }else if(playerWinRule([2,4,6],'✓')){
    alert("✓ wins");
  }
}



</script>
</body>


</html>

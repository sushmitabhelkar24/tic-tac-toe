<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body{
            background-color: cadetblue;
            margin: 0;
            padding: 0;
        }
        .head{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-items: center;
        }
        h1{
            font-size: 100px;
            color:white;
            margin-top: 5px;
            text-align: center;
        }
        .image{
            display: flex;
            justify-content: space-around;
        }
        .img{
            height: 150px;
            margin-top: 80px;
            
        }
        .img1{
            height: 200px;
            margin-top: 80px;
            
        }
        p{
            font-size: 100px;
            color:white;
        }
        .board{
            width:fit-content;
            display: block;
            margin: 20px auto;
            border: 10px solid rgb(40, 64, 77);
        }
        .row{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: aquamarine;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 0 8px 0 white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box:hover{
            transition: 0.5s;
            border-radius: 10px;
            box-shadow: 0 0 12px 0 white;
            background-color: rgb(89, 242, 191);
        }
        .Player{
            display: block;
            text-align: center;
            font-size: larger;
        }
        .btn{
            display:block;
            text-align: center;
            padding: 5px 20px;
            background-color:aquamarine ;
            border-radius: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
   <div>
    <div class="image">
        
      <img src="right-arrow.png" alt="arrow" class="img"/>
         <h1>Tac</h1>
      <img src="left-arrow.png" alt="arrow" class="img1"/>
    </div>
    <div class="head">
        <p style="margin-left: 50px;">Tic</p>
    
    <div class="board">
        <div class="row">
            <div class="box" onclick="selectBox(0)">1</div>
            <div class="box" onclick="selectBox(1)">2</div>
            <div class="box" onclick="selectBox(2)">3</div> 
         </div>
         <div class="row">
            <div class="box" onclick="selectBox(3)">4</div>
            <div class="box" onclick="selectBox(4)">5</div>
            <div class="box" onclick="selectBox(5)">6</div> 
         </div>
         <div class="row">
            <div class="box" onclick="selectBox(6)">7</div>
            <div class="box" onclick="selectBox(7)">8</div>
            <div class="box" onclick="selectBox(8)">9</div> 
         </div>
    </div>
       <p style="margin-right: 50px;">Toe</p>

    </div>
    <div><span class="Player" >Current Player : <span id="wrongright">X</span></span> </div>
     <div><button class="btn" onclick="loadGame()">Reset</button></div>
    
    </div>
<script>
 const board=[-1,-1,-1,-1,-1,-1,-1,-1,-1];
 let currentPlayer = 'X'
 function boardPlay(){
    const allBoxes = document.querySelectorAll('.box');
   
    allBoxes.forEach((boxContent,i)=>{
        if(board[i]=== 'X'){
            boxContent.innerHTML = '<img src="cancel.png" height="90px"/>';
        }else if(board[i] === '✓'){
            boxContent.innerHTML = '<img src="tick.png" height="90px"/>';
        }else{
            boxContent.innerHTML = '';
        }
    })
}
boardPlay();

function selectBox(boxNum){

    if(board[boxNum] !== -1){
        alert("Invaild move click elsewhere")
        return;
    }

    board[boxNum] = currentPlayer
    boardPlay();

    if(currentPlayer === 'X'){
        currentPlayer = '✓'
    }else{
        currentPlayer = 'X'
    }

    const getCurrentPlay = document.getElementById("wrongright");
    getCurrentPlay.innerText = currentPlayer
}

function loadGame(){
    board.fill(-1);
    boardPlay();

    currentPlayer = 'X';
    const getCurrentPlay = document.getElementById("wrongright");
    getCurrentPlay.innerText = currentPlayer;
}
</script>
</body>


</html>
